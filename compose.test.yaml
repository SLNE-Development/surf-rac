services:
  db:
    image: postgres:17-alpine
    command: ["postgres", "-c", "max_connections=500"]
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  livekit:
    image: livekit/livekit-server:v1.13.7
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./deploy/livekit/livekit.test.yaml:/etc/livekit.yaml:ro

  test:
    build:
      context: deploy/test
    working_dir: /work
    volumes:
      - .:/work
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/work/target
    environment:
      DATABASE_URL: postgres://postgres:postgres@db/postgres
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: surfractest
      LIVEKIT_API_SECRET: surf-rac-test-secret-0123456789abcdef
      CARGO_TERM_COLOR: never
      # More parallel tests exhaust sqlx's shared test-database pool and stall for 30 s.
      RUST_TEST_THREADS: "8"
    depends_on:
      db:
        condition: service_healthy
      livekit:
        condition: service_started
    command: ["cargo", "test", "--workspace"]

volumes:
  cargo-registry:
  cargo-target:

# LiveKit's embedded TURN does not relay to private addresses, so the test network
# uses a non-private range to make forced-relay sessions possible.
networks:
  default:
    ipam:
      config:
        - subnet: 198.18.0.0/24
